<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Page - Exportly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-[#f5f5f7] flex items-center justify-center min-h-screen py-10">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-lg">
        
        <a href="{% url 'dashboard' %}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">&larr; Back to Dashboard</a>

        <div class="mb-6">
            <h1 class="text-2xl font-bold text-gray-900">Add a New Page</h1>
            <p class="text-gray-500 mt-1 text-sm">Create custom pages like About Us, Contact, etc.</p>
        </div>

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Page Title</label>
                <input type="text" name="title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="e.g. About Us">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Content</label>
                <textarea name="content" rows="6" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="Write about your company..."></textarea>
            </div>

            <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition shadow-sm">
                Save Page
            </button>
        </form>

    </div>
</body>
</html>
