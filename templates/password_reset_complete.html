<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Changed - Exportly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-[#f5f5f7] flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md text-center">
        
        <div class="w-16 h-16 bg-green-50 text-green-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="text-2xl font-bold text-gray-900 mb-2">Password Changed!</h1>
        <p class="text-gray-500 text-sm mb-8">
            Your password has been successfully set. You can now log in with your new password.
        </p>

        <a href="{% url 'login' %}" class="block w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition shadow-sm">
            Log In Now
        </a>
    </div>

</body>
</html>
