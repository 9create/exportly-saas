<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Update Profile - Exportly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-[#f5f5f7] flex items-center justify-center min-h-screen py-10">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-lg">
        <a href="{% url 'dashboard' %}" class="text-sm text-blue-600 hover:underline mb-4 inline-block">&larr; Back</a>
        <h1 class="text-2xl font-bold mb-6">Update Profile</h1>
        
        <!-- enctype="multipart/form-data" images ke liye zaroori hai -->
        <form method="POST" action="" enctype="multipart/form-data">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Company Name</label>
                <input type="text" name="company_name" value="{{ request.user.company_name|default:'' }}" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="text" name="phone" value="{{ request.user.phone|default:'' }}" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Cover Photo</label>
                <input type="file" name="cover_image" accept="image/*" class="w-full px-4 py-2 border rounded-lg bg-gray-50">
            </div>

            <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition">Save Profile</button>
        </form>
    </div>
</body>
</html>
