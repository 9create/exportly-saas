<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exportly</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style> body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; } </style>
</head>
<body class="bg-[#f5f5f7] flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
        
        <div class="text-center mb-8">
            <!-- Exportly Logo linking to Home Page -->
            <a href="{% url 'home' %}" class="inline-block text-3xl font-extrabold tracking-tight text-blue-600 mb-6 hover:opacity-80 transition">
                Exportly
            </a>
            <h1 class="text-3xl font-bold text-gray-900">Welcome Back</h1>
            <p class="text-gray-500 mt-2 text-sm">Log in to manage your export website.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="bg-red-100 text-red-700 p-3 rounded-lg mb-4 text-sm text-center">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="rahul123">
            </div>

            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                <div class="relative">
                    <input type="password" name="password" id="login_password" required class="w-full px-4 py-2 pr-10 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition" placeholder="••••••••">
                    
                    <!-- Eye Icon Button -->
                    <button type="button" onclick="togglePasswordVisibility('login_password', 'eye-icon-login')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none">
                        <svg id="eye-icon-login" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>
                </div>
                <!-- Forgot Password Link -->
                <div class="text-right mt-1.5">
                    <a href="{% url 'password_reset' %}" class="text-xs text-blue-600 hover:text-blue-800 font-medium hover:underline transition">
                        Forgot Password?
                    </a>
                </div>
            </div>

            <button type="submit" class="w-full bg-black text-white py-2.5 rounded-lg font-medium hover:bg-gray-800 transition shadow-sm">
                Log In
            </button>
        </form>

        <p class="text-center text-sm text-gray-600 mt-6">
            Don't have an account? <a href="{% url 'signup' %}" class="text-blue-600 font-medium hover:underline">Sign up</a>
        </p>

        <!-- NAYA: Legal Links (Professional Touch) -->
        <div class="mt-8 pt-6 border-t border-gray-100 flex flex-wrap justify-center gap-4 text-xs text-gray-400">
            <a href="{% url 'platform_privacy' %}" class="hover:text-gray-700 transition">Privacy Policy</a>
            <span class="text-gray-300">•</span>
            <a href="{% url 'platform_terms' %}" class="hover:text-gray-700 transition">Terms of Service</a>
            <span class="text-gray-300">•</span>
            <a href="{% url 'platform_disclaimer' %}" class="hover:text-gray-700 transition">Disclaimer</a>
        </div>
    </div>
    <script>
        function togglePasswordVisibility(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);

            if (input.type === 'password') {
                input.type = 'text';
                // Change to Eye-off icon (band aankh)
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"></path>
                `;
            } else {
                input.type = 'password';
                // Change back to Eye icon (khuli aankh)
                icon.innerHTML = `
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                `;
            }
        }
    </script>
</body>
</html>
